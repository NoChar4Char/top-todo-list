<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
</head>
<body>
  <header>
    <h1>Book List</h1>
    <button class="book-button all-buttons">Add Book</button>
  </header>
  <hr>
  <main>
    <section class="todo-container"></section>
    <!-- TEMPLATE -->
      <dialog class="prompt-dialog">
        <form>
          <fieldset class="form-fieldset">
            <legend class="form-heading">Add Your Task</legend>
            <label class="form-label label-name">Project Name: <br> <input type="text" name="name" class="form-input input-name" minlength="1" maxlength="100" required> </label>
            <label class="form-label label-desc">Project Name: <br> <textarea name="desc" class="form-input input-desc"></textarea></label>
            <label class="form-label label-date">Set a Date: <br> <input type="date" name="name" class="form-input input-date"></label>
            <label class="form-label label-priority">Set a Date: <br> 
              <select name="priority" class="form-input input-priority">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </label>
          </fieldset>
        </form>
      </dialog>
    </section>
    <template class="book-template">
      <div class="one-library-book">
        <div class="book-info">
          <h1 class="title-book">The Great Gatsby</h1>
          <h3 class="author">F. Scott Fritzgerald</h3>
          <h3 class="page-number">180 Pages</h3>
          <h3 class="read-status">Read</h3>
          <h3 class="id"></h3>
        </div>
        <div class="book-settings">
          <button class="book-settings-buttons edit-book all-buttons">Edit</button>
          <button class="book-settings-buttons delete-book all-buttons">Delete</button>
        </div>
      </div>
    </template>

    <dialog id="form-dialog">
      <form id="form">
        <fieldset>
          <legend class="form-heading">BOOK DETAILS</legend>
          <label for="book-name" class="form-label form-book">Book Name <br> <input required type="text" name="title" class="form-input book-name"></label>

          <label for="book-author" class="form-label form-author">Book Author <br> <input required type="text" name="author" class="form-input book-author"></label>

          <label for="total-page" class="form-label form-page">Total Page Count <br> <input required type="number" min="1" max="9999" step="1" name="pageCount" class="form-input total-page"></label>

          <label for="have-read" class="form-label form-checkbox">I have read this book<input type="checkbox" name="have-read" class="form-input have-read"> </label>

          <section class="submit-close-sect">
            <button type="submit" class="submit-button all-buttons">Submit</button>
            <button type="button" class="close-button all-buttons">Close</button>
          </section>
        </fieldset>
      </form>
    </dialog>
    </main>
</body>
</html>
